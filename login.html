<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>VaultFlow — Login</title><link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;1,300&family=Montserrat:wght@300;400;500&display=swap" rel="stylesheet"><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>*{margin:0;padding:0;box-sizing:border-box}body{background:#080808;color:#F5F0E8;font-family:'Montserrat',sans-serif;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px}.card{width:100%;max-width:400px;padding:48px 40px;background:#0E0E0E;border:1px solid #C9A84C22}.logo{font-family:'Cormorant Garamond',serif;font-size:24px;letter-spacing:6px;text-align:center;margin-bottom:8px}.logo span{color:#C9A84C}.tagline{font-size:9px;letter-spacing:3px;color:#8B6914;text-align:center;margin-bottom:40px}.divider{height:1px;background:linear-gradient(90deg,transparent,#C9A84C44,transparent);margin-bottom:32px}.tabs{display:flex;margin-bottom:32px;border-bottom:1px solid #C9A84C22}.tab{flex:1;padding:12px;background:none;border:none;border-bottom:2px solid transparent;color:#8A8070;font-size:10px;letter-spacing:3px;cursor:pointer;font-family:'Montserrat',sans-serif;transition:all 0.3s}.tab.active{color:#C9A84C;border-bottom-color:#C9A84C}.label{font-size:9px;letter-spacing:2px;color:#8B6914;margin-bottom:8px;margin-top:20px}.inp{width:100%;background:#141414;border:1px solid #C9A84C22;color:#F5F0E8;padding:13px 16px;font-size:12px;font-family:'Montserrat',sans-serif;outline:none;transition:border 0.3s}.inp:focus{border-color:#C9A84C44}.inp::placeholder{color:#8A8070}.btn{width:100%;margin-top:28px;padding:14px;background:linear-gradient(135deg,#8B6914,#C9A84C);border:none;color:#080808;font-size:10px;letter-spacing:3px;cursor:pointer;font-family:'Montserrat',sans-serif;font-weight:600;transition:opacity 0.3s}.btn:hover{opacity:0.85}.msg{margin-top:16px;font-size:11px;letter-spacing:1px;text-align:center;min-height:20px}.back{display:block;text-align:center;margin-top:24px;font-size:9px;letter-spacing:2px;color:#8A8070;text-decoration:none}.back:hover{color:#C9A84C}</style></head><body><div class="card"><div class="logo">VAULT<span>FLOW</span></div><div class="tagline">INTELLIGENT WEALTH ALLOCATION</div><div class="divider"></div><div class="tabs"><button class="tab active" id="loginTab" onclick="showTab('login')">SIGN IN</button><button class="tab" id="signupTab" onclick="showTab('signup')">CREATE ACCOUNT</button></div><div id="loginForm"><div class="label">EMAIL</div><input class="inp" type="email" id="loginEmail" placeholder="your@email.com"><div class="label">PASSWORD</div><input class="inp" type="password" id="loginPass" placeholder="••••••••"><button class="btn" onclick="login()">SIGN IN</button></div><div id="signupForm" style="display:none"><div class="label">EMAIL</div><input class="inp" type="email" id="signupEmail" placeholder="your@email.com"><div class="label">PASSWORD</div><input class="inp" type="password" id="signupPass" placeholder="Min 6 characters"><div class="label">CONFIRM PASSWORD</div><input class="inp" type="password" id="signupPass2" placeholder="Repeat password"><button class="btn" onclick="signup()">CREATE ACCOUNT</button></div><div class="msg" id="msg"></div><a href="index.html" class="back">← BACK TO VAULTFLOW</a></div><script>const SUPABASE_URL='https://sefxpcatuctgqwflmrdj.supabase.co';const SUPABASE_KEY='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InNlZnhwY2F0dWN0Z3F3ZmxtcmRqIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzg2NjU5NjEsImV4cCI6MjA5NDI0MTk2MX0.64rTufpnz7YFn_WRP5es2zwpd5sQxP1I24U8Dj_QtgQ';const sb=supabase.createClient(SUPABASE_URL,SUPABASE_KEY);function showTab(t){document.getElementById('loginForm').style.display=t==='login'?'block':'none';document.getElementById('signupForm').style.display=t==='signup'?'block':'none';document.getElementById('loginTab').className='tab'+(t==='login'?' active':'');document.getElementById('signupTab').className='tab'+(t==='signup'?' active':'');document.getElementById('msg').textContent='';}function setMsg(text,color){const m=document.getElementById('msg');m.textContent=text;m.style.color=color||'#C9A84C';}async function login(){const email=document.getElementById('loginEmail').value;const pass=document.getElementById('loginPass').value;if(!email||!pass){setMsg('Please fill in all fields.','#ff4444');return;}setMsg('Signing in...','#C9A84C');const{error}=await sb.auth.signInWithPassword({email,password:pass});if(error){setMsg(error.message,'#ff4444');}else{setMsg('Welcome back.','#00ff88');setTimeout(()=>window.location.href='dashboard.html',1000);}}async function signup(){const email=document.getElementById('signupEmail').value;const pass=document.getElementById('signupPass').value;const pass2=document.getElementById('signupPass2').value;if(!email||!pass||!pass2){setMsg('Please fill in all fields.','#ff4444');return;}if(pass!==pass2){setMsg('Passwords do not match.','#ff4444');return;}if(pass.length<6){setMsg('Password must be at least 6 characters.','#ff4444');return;}setMsg('Creating account...','#C9A84C');const{error}=await sb.auth.signUp({email,password:pass});if(error){setMsg(error.message,'#ff4444');}else{setMsg('Account created. Check your email to confirm.','#00ff88');}}</script></body></html>
